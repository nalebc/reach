version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release waits a week before it's proposed: time for a bad or
    # hijacked version to be pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # One pull request a week for routine bumps; a major bump stays on its own.
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release waits a week before it's proposed: time for a bad or
    # hijacked version to be pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /tailnet
    schedule:
      interval: weekly
    # A release waits a week before it's proposed: time for a bad or
    # hijacked version to be pulled first.
    cooldown:
      default-days: 7
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
