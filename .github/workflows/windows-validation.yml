name: Windows validation
# The Windows parity work's quick loop (docs/WINDOWS_AGENT_PARITY.md): only
# the Windows tests asked for, on a real Windows runner under a normal PC's
# Restricted script policy, without the whole CI matrix. Never a required
# check; CI's own Windows lane runs the same tests for merges.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Windows version and architecture
        type: choice
        required: false
        default: windows-2025
        options:
          - windows-2025
          - windows-2022
          - windows-11-arm
      tests:
        description: Test files under test/, space-separated
        required: false
        default: windows-desktop-native windows-desktop-e2e windows-agent-desktop-native agent-desktop-windows-policy
      real_vendors:
        description: Run official vendors, six native security checks and local acceptance instead of selected tests (no sign-in)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: windows-validation-${{ github.ref }}-${{ inputs.runner || 'windows-2025' }}
  cancel-in-progress: true
jobs:
  windows:
    # Keep dispatch limited to these hosted images, including API callers.
    runs-on: ${{ inputs.runner == 'windows-11-arm' && 'windows-11-arm' || inputs.runner == 'windows-2022' && 'windows-2022' || 'windows-2025' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:release
      - name: Install CPU-matching official vendors without signing in
        id: vendors
        if: ${{ inputs.real_vendors }}
        shell: pwsh
        run: ./test/acceptance/install-windows-vendors.ps1
      - name: Verify the disposable runner has a usable desktop
        id: desktop_preflight
        run: node .github/scripts/prepare-windows-desktop.mjs --if-needed
        env:
          REACH_CI_DESKTOP_PREFLIGHT: "1"
          REACH_CI_DESKTOP_REQUIRED: ${{ inputs.real_vendors && '1' || '0' }}
          TESTS: ${{ inputs.tests }}
      - name: Real Windows socket directory and junction security checks
        id: native_socket
        if: ${{ inputs.real_vendors && !cancelled() }}
        shell: pwsh
        run: |
          powershell.exe -NoProfile -Command "Set-ExecutionPolicy Restricted -Scope LocalMachine -Force; Set-ExecutionPolicy Restricted -Scope CurrentUser -Force"
          if ($LASTEXITCODE) { exit 1 }
          npm run test:file -- --test-timeout=180000 test/windows-codex-socket-native.test.mjs
      - name: Real standard-user Codex and visible-console local acceptance
        id: probes
        if: ${{ inputs.real_vendors && !cancelled() && steps.desktop_preflight.outcome == 'success' && steps.vendors.outcome == 'success' }}
        shell: pwsh
        env:
          REACH_REAL_WINDOWS_ACCEPTANCE: "1"
          REACH_ACCEPTANCE_PR_HEAD: ${{ github.sha }}
        run: npm run test:file -- --test-timeout=900000 --test-concurrency=1 test/acceptance/real-windows.test.mjs
      - name: Record combined real-vendor scope and incomplete device qualification
        if: ${{ always() && inputs.real_vendors }}
        shell: pwsh
        env:
          PROBE_OUTCOME: ${{ steps.probes.outcome }}
          NATIVE_SOCKET_OUTCOME: ${{ steps.native_socket.outcome }}
        run: ./test/acceptance/finalize-windows-report.ps1
      - name: Chosen tests under a normal PC's script policy
        if: ${{ !inputs.real_vendors && steps.desktop_preflight.outcome == 'success' }}
        # PowerShell 7 (this step's shell) keeps its own policy; Reach's
        # helpers run in Windows PowerShell, which gets the Restricted one.
        shell: pwsh
        env:
          TESTS: ${{ inputs.tests }}
          REACH_TEST_WINDOWS_DESKTOP: "1"
          # The public door's spike (docs/parity/D-public-door.md §8): a real
          # LocalSystem service and standard users, on this disposable runner
          # only. It joins ci.yml after three green runs here.
          REACH_TEST_WINDOWS_PEER: "1"
          # The user journeys install an agent from its maker's site here
          # (test/journeys/chat.test.mjs); ci.yml leaves the internet out.
          REACH_TEST_AGENT_INSTALL: "1"
        run: |
          powershell.exe -NoProfile -Command "Set-ExecutionPolicy Restricted -Scope LocalMachine -Force; Set-ExecutionPolicy Restricted -Scope CurrentUser -Force; Get-ExecutionPolicy -List"
          if ($LASTEXITCODE) { exit 1 }
          node .github/scripts/windows-validation.mjs
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation
          path: reports/
          if-no-files-found: warn
          retention-days: 14
