name: Real Windows acceptance (partial qualification)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-windows-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-windows:
    name: Real Windows vendor and local probes (device qualification incomplete)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Install official vendor releases without signing in
        # This is deliberately a published-CLI canary. The resolved version,
        # npm integrity and native executable hash are retained as evidence.
        # The guarded acceptance test reports an install failure too, so its
        # other independent probes and incomplete matrix can still run.
        continue-on-error: true
        shell: pwsh
        run: ./test/acceptance/install-windows-vendors.ps1
      - name: Real processes, visible CLI console, browser and local HTTP
        id: probes
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          REACH_REAL_WINDOWS_ACCEPTANCE: "1"
          REACH_ACCEPTANCE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          powershell.exe -NoProfile -Command "Set-ExecutionPolicy Restricted -Scope LocalMachine -Force; Set-ExecutionPolicy Restricted -Scope CurrentUser -Force"
          if ($LASTEXITCODE) { exit 1 }
          npm run test:file -- --test-timeout=900000 --test-concurrency=1 test/acceptance/real-windows.test.mjs
      - name: Record incomplete qualification if prerequisites prevented the probes
        if: always()
        shell: pwsh
        env:
          PROBE_OUTCOME: ${{ steps.probes.outcome }}
        run: |
          $reportDir = Join-Path $env:GITHUB_WORKSPACE 'reports\real-windows-acceptance'
          New-Item -ItemType Directory -Force $reportDir | Out-Null
          if (-not (Test-Path (Join-Path $reportDir 'acceptance.json'))) {
            $report = @{ overall = 'FAIL'; fullDeviceQualification = $false; qualification = 'INCOMPLETE: real Windows probes did not reach their reporter'; cases = @(
              @{ id = 'windows-probe-prerequisites'; status = 'FAIL'; reason = 'Inspect the installation/build/test steps.' },
              @{ id = 'private-tailscale-funnel-and-recovery'; status = 'BLOCKED'; reason = 'Approved real Tailscale identities and credentials are absent; no enrollment attempted.' },
              @{ id = 'provider-inference'; status = 'BLOCKED'; reason = 'No signed-in provider account.' },
              @{ id = 'physical-iphone-ipad-android'; status = 'BLOCKED'; reason = 'No authorized physical clients.' }
            ) }
            $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $reportDir 'acceptance.json')
            '## Real Windows acceptance: FAIL' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '**Overall real-device qualification is incomplete.** Windows probes did not complete. Authenticated Tailscale/Funnel/recovery, provider inference, and physical iPhone/iPad/Android remain BLOCKED.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          } elseif ($env:PROBE_OUTCOME -ne 'success') {
            $report = Get-Content (Join-Path $reportDir 'acceptance.json') -Raw | ConvertFrom-Json
            $report.overall = 'FAIL'
            foreach ($case in $report.cases) {
              if ($case.status -eq 'RUNNING') { $case.status = 'FAIL' }
            }
            $report | ConvertTo-Json -Depth 20 | Set-Content (Join-Path $reportDir 'acceptance.json')
            'The Windows probe process failed or was interrupted. The acceptance artifact is marked FAIL; overall real-device qualification remains incomplete.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
      - name: Preserve only redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-windows-acceptance
          path: reports/real-windows-acceptance/
          if-no-files-found: warn
          retention-days: 14
