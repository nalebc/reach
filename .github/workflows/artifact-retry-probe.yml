name: Artifact retry diagnostic
# Synthetic artifact-action diagnostic only; this does not qualify Reach.
on:
  push:
    branches: [validation/artifact-retry-20261019]
permissions:
  contents: read
concurrency:
  group: artifact-retry-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  producer:
    uses: ./.github/workflows/artifact-retry-producer.yml
    permissions:
      contents: read
  consumer:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - id: context
        name: Record synthetic source and attempt context
        env:
          PRODUCER_ARTIFACT_ID: ${{ needs.producer.outputs.artifact-id }}
          PRODUCER_ARTIFACT_DIGEST: ${{ needs.producer.outputs.artifact-digest }}
          PRODUCER_RECEIPT_SHA256: ${{ needs.producer.outputs.receipt-sha256 }}
        run: |
          node --input-type=module <<'PROBE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const env = process.env;
          const attempt = Number(env.GITHUB_RUN_ATTEMPT);
          if (env.GITHUB_REPOSITORY !== 'nalebc/reach' || env.GITHUB_EVENT_NAME !== 'push' ||
              env.GITHUB_REF !== 'refs/heads/validation/artifact-retry-20261019' ||
              !/^[a-f0-9]{40}$/.test(env.GITHUB_SHA) || !/^[1-9][0-9]*$/.test(env.GITHUB_RUN_ID) ||
              ![1, 2].includes(attempt)) throw Error('Unexpected synthetic probe source or attempt.');
          const receipt = {
            schema: 1,
            probe: 'reach-pinned-artifact-retry-20261019',
            repository: env.GITHUB_REPOSITORY,
            baseCommit: '6a82cb17043e27468d0c338ab5e4138dcaf68187',
            commit: env.GITHUB_SHA,
            ref: env.GITHUB_REF,
            runId: env.GITHUB_RUN_ID,
            producerAttempt: 1,
          };
          const expected = `${JSON.stringify(receipt, null, 2)}\n`;
          const sha256 = crypto.createHash('sha256').update(expected).digest('hex');
          const directory = path.join(env.RUNNER_TEMP, 'artifact-retry-consumer-evidence');
          fs.mkdirSync(directory, { recursive: false });
          fs.writeFileSync(path.join(directory, 'expected-receipt.json'), expected);
          fs.writeFileSync(path.join(directory, 'context.json'), `${JSON.stringify({
            schema: 1, purpose: 'Synthetic pinned-artifact retry diagnostic; no Reach qualification.',
            repository: env.GITHUB_REPOSITORY, commit: env.GITHUB_SHA, ref: env.GITHUB_REF,
            runId: env.GITHUB_RUN_ID, consumerAttempt: attempt, jobKey: env.GITHUB_JOB,
            workflowRef: env.GITHUB_WORKFLOW_REF, workflowSha: env.GITHUB_WORKFLOW_SHA,
            expectedReceiptSha256: sha256,
            inheritedProducerOutputs: { artifactId: env.PRODUCER_ARTIFACT_ID || null,
              artifactDigest: env.PRODUCER_ARTIFACT_DIGEST || null,
              receiptSha256: env.PRODUCER_RECEIPT_SHA256 || null },
          }, null, 2)}\n`);
          console.log(JSON.stringify({ probe: receipt.probe, commit: receipt.commit, runId: receipt.runId,
            consumerAttempt: attempt, expectedReceiptSha256: sha256 }));
          PROBE
      - id: expected_stop
        name: Expected diagnostic failure on the original attempt
        if: ${{ github.run_attempt == 1 }}
        run: |
          node --input-type=module <<'PROBE'
          import fs from 'node:fs';
          import path from 'node:path';
          const message = 'EXPECTED_DIAGNOSTIC_FAILURE_BEFORE_DOWNLOAD: rerun failed consumer only after preserving attempt 1 evidence.';
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'artifact-retry-consumer-evidence', 'expected-stop.txt'), `${message}\n`);
          console.log(message);
          process.exitCode = 1;
          PROBE
      - id: download
        name: Download the original producer by name without an explicit token
        if: ${{ success() && github.run_attempt == 2 }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2; identical release prepare pin
        with:
          name: reach-artifact-retry-original
          path: ${{ runner.temp }}/artifact-retry-downloaded
      - id: verify
        name: Compare exact original commit-bound receipt bytes
        if: ${{ success() && github.run_attempt == 2 }}
        env:
          PRODUCER_RECEIPT_SHA256: ${{ needs.producer.outputs.receipt-sha256 }}
        run: |
          node --input-type=module <<'PROBE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const directory = path.join(process.env.RUNNER_TEMP, 'artifact-retry-downloaded');
          const names = fs.readdirSync(directory).sort();
          if (JSON.stringify(names) !== JSON.stringify(['SHA256SUMS', 'receipt.json'])) throw Error('Unexpected producer artifact members.');
          for (const name of names) if (!fs.lstatSync(path.join(directory, name)).isFile()) throw Error('Producer members must be regular files.');
          const expected = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'artifact-retry-consumer-evidence', 'expected-receipt.json'));
          const actual = fs.readFileSync(path.join(directory, 'receipt.json'));
          if (!actual.equals(expected)) throw Error('Downloaded receipt bytes differ from the exact original producer receipt.');
          const sha256 = crypto.createHash('sha256').update(actual).digest('hex');
          if (fs.readFileSync(path.join(directory, 'SHA256SUMS'), 'utf8') !== `${sha256}  receipt.json\n`) throw Error('Producer checksum sidecar does not match.');
          if (process.env.PRODUCER_RECEIPT_SHA256 && process.env.PRODUCER_RECEIPT_SHA256 !== sha256) throw Error('Inherited producer checksum output conflicts.');
          const result = { schema: 1, classification: 'PINNED_ACTION_CROSS_ATTEMPT_RECEIPT_PASS',
            commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, consumerAttempt: 2,
            producerAttempt: 1, receiptSha256: sha256, exactOriginalReceiptBytes: true };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'artifact-retry-consumer-evidence', 'verified-original.json'), `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result));
          PROBE
      - id: outcome
        name: Preserve diagnostic outcomes even after failure
        if: ${{ always() }}
        env:
          CONTEXT_OUTCOME: ${{ steps.context.outcome }}
          EXPECTED_STOP_OUTCOME: ${{ steps.expected_stop.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          node --input-type=module <<'PROBE'
          import fs from 'node:fs';
          import path from 'node:path';
          const env = process.env;
          const attempt = Number(env.GITHUB_RUN_ATTEMPT);
          const expectedFailure = attempt === 1 && env.CONTEXT_OUTCOME === 'success' &&
            env.EXPECTED_STOP_OUTCOME === 'failure' && env.DOWNLOAD_OUTCOME === 'skipped' && env.VERIFY_OUTCOME === 'skipped';
          const receiptPass = attempt === 2 && env.CONTEXT_OUTCOME === 'success' &&
            env.EXPECTED_STOP_OUTCOME === 'skipped' && env.DOWNLOAD_OUTCOME === 'success' && env.VERIFY_OUTCOME === 'success';
          const result = { schema: 1, classification: expectedFailure ? 'EXPECTED_DIAGNOSTIC_FAILURE_BEFORE_DOWNLOAD' :
            receiptPass ? 'PINNED_ACTION_CROSS_ATTEMPT_RECEIPT_PASS' : 'DIAGNOSTIC_FAILURE_REQUIRES_LOG_REVIEW',
            repository: env.GITHUB_REPOSITORY, commit: env.GITHUB_SHA, ref: env.GITHUB_REF,
            runId: env.GITHUB_RUN_ID, consumerAttempt: attempt,
            outcomes: { context: env.CONTEXT_OUTCOME, expectedStop: env.EXPECTED_STOP_OUTCOME,
              download: env.DOWNLOAD_OUTCOME, verify: env.VERIFY_OUTCOME },
            limits: 'Tests pinned artifact action cross-attempt behavior only; no native, package, security, or release qualification.' };
          const directory = path.join(env.RUNNER_TEMP, 'artifact-retry-consumer-evidence');
          fs.mkdirSync(directory, { recursive: true });
          fs.writeFileSync(path.join(directory, 'outcome.json'), `${JSON.stringify(result, null, 2)}\n`);
          fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `Synthetic artifact retry diagnostic: **${result.classification}**\n\n${result.limits}\n`);
          console.log(JSON.stringify(result));
          PROBE
      - id: evidence
        name: Upload attempt evidence without overwriting the original
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; identical release prepare pin
        with:
          name: reach-artifact-retry-consumer-evidence
          path: ${{ runner.temp }}/artifact-retry-consumer-evidence/*
          archive: true
          overwrite: false
          if-no-files-found: error
          retention-days: 7
      - name: Log immutable artifact output identity and final diagnostic scope
        if: ${{ always() }}
        env:
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'PROBE'
          const result = { schema: 1, commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            consumerAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), evidenceUploadOutcome: process.env.EVIDENCE_OUTCOME,
            evidenceArtifactId: process.env.EVIDENCE_ARTIFACT_ID || null,
            evidenceArtifactDigest: process.env.EVIDENCE_ARTIFACT_DIGEST || null,
            scope: 'Synthetic action diagnostic only. Preserve prior attempt artifacts; do not delete or overwrite a name collision.' };
          console.log(JSON.stringify(result));
          PROBE
