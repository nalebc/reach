name: Agent release compatibility
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "41 7 * * *"
permissions:
  contents: read
jobs:
  published-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
            package: "@anthropic-ai/claude-code@latest"
            node: 22
          - agent: codex
            package: "@openai/codex@latest"
            node: 22
          # Starts a throwaway Gateway of its own (scripts/openclaw-canary.mjs).
          # OpenClaw 2026.9 and later refuse Node older than 24.16.
          - agent: openclaw
            package: "openclaw@latest"
            node: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - name: Install published CLI in disposable runner
        # The point is the CLI as published today, so it is deliberately unpinned.
        env:
          AGENT_PACKAGE: ${{ matrix.package }}
        run: npm install --global "$AGENT_PACKAGE" # zizmor: ignore[adhoc-packages]
      - name: Check CLI and protocol contracts without signing in
        env:
          AGENT: ${{ matrix.agent }}
        run: node scripts/check-agent-compatibility.mjs "$AGENT" > agent-compatibility.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compatibility-${{ matrix.agent }}
          path: agent-compatibility.json
          if-no-files-found: error
          retention-days: 14
