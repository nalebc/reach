name: Release Reach
# Release code is tested with read-only permissions on disposable runners.
# Only the final, protected job receives publishing authority, and it never
# checks out source, installs dependencies, or runs package lifecycle scripts.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  eligible:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only reviewed public-main commits and an explicitly protected environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false
          gh api "repos/$GITHUB_REPOSITORY/environments/npm-release" > "$RUNNER_TEMP/release-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/npm-release/deployment-branch-policies" > "$RUNNER_TEMP/release-branches.json"
          node --input-type=module <<'CHECK'
          import fs from 'node:fs';
          const environment = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-environment.json`, 'utf8'));
          const rule = environment.protection_rules?.find(rule => rule.type === 'required_reviewers');
          if (!rule?.reviewers?.length) throw Error('npm-release must require explicit maintainer approval. Configure a required reviewer before tagging.');
          if (environment.can_admins_bypass !== false) throw Error('npm-release must disable administrator bypass.');
          const policy = environment.deployment_branch_policy;
          if (!policy?.custom_branch_policies) throw Error('npm-release must restrict deployments to protected release tags.');
          const branches = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-branches.json`, 'utf8')).branch_policies;
          if (branches?.length !== 1 || branches[0].type !== 'tag' || branches[0].name !== 'v*') throw Error('npm-release must allow only tags matching v*.');
          CHECK
      - id: version
        name: Validate tag, package repository and dated release notes
        run: |
          node --input-type=module <<'CHECK'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(pkg.version) || process.env.GITHUB_REF_NAME !== `v${pkg.version}`) throw Error('Tag must equal v plus the package version.');
          if (pkg.repository?.url !== `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`) throw Error('package.json repository must identify this public repository.');
          const heading = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n').find(line => line.startsWith(`## [${pkg.version}]`));
          if (!heading || /unreleased/i.test(heading) || !/\d{4}-\d{2}-\d{2}/.test(heading)) throw Error('Date the matching CHANGELOG.md release heading before tagging.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          CHECK
  verify:
    needs: eligible
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] same-commit reference; actionlint 1.7.12 does not yet parse the equivalent $/ syntax
    permissions:
      contents: read
  security:
    needs: eligible
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] same-commit reference; actionlint 1.7.12 does not yet parse the equivalent $/ syntax
    permissions:
      contents: read
      actions: read
      security-events: write
  prepare:
    needs: [eligible, verify, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      checksums: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reach-ubuntu-24.04-node22
          path: candidate
      - name: Bind the exact verified artifact to this commit and notes
        env:
          VERSION: ${{ needs.eligible.outputs.version }}
        run: |
          set -euo pipefail
          (cd candidate && sha256sum --check --strict SHA256SUMS)
          node --input-type=module <<'CHECK'
          import fs from 'node:fs';
          const version = process.env.VERSION;
          const candidate = JSON.parse(fs.readFileSync('candidate/candidate.json', 'utf8'));
          if (candidate.commit !== process.env.GITHUB_SHA || candidate.version !== version || candidate.package !== '@nalebc/reach') throw Error('Artifact identity does not match this release.');
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex(line => line.startsWith(`## [${version}]`));
          const end = lines.findIndex((line, index) => index > start && line.startsWith('## '));
          const notes = lines.slice(start + 1, end < 0 ? undefined : end).join('\n').trim();
          const sums = fs.readFileSync('candidate/SHA256SUMS', 'utf8');
          fs.writeFileSync('candidate/NOTES.md', `${notes}\n\n## Checksums (SHA-256)\n\n\`\`\`\n${sums}\`\`\`\n`);
          CHECK
      - id: checksum
        run: echo "sha256=$(sha256sum candidate/SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [eligible, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: candidate
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the artifact again before obtaining publishing credentials
        env:
          EXPECTED_CHECKSUMS: ${{ needs.prepare.outputs.checksums }}
          VERSION: ${{ needs.eligible.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CHECKSUMS" =~ ^[a-f0-9]{64}$ ]]
          echo "$EXPECTED_CHECKSUMS  candidate/SHA256SUMS" | sha256sum --check --strict
          (cd candidate && sha256sum --check --strict SHA256SUMS)
          node --input-type=module <<'CHECK'
          import fs from 'node:fs';
          const version = process.env.VERSION;
          const expected = [`nalebc-reach-${version}.tgz`, `reach-${version}-portable.tar.gz`];
          const sums = fs.readFileSync('candidate/SHA256SUMS', 'utf8').trim().split('\n');
          if (sums.length !== 2 || sums.some((line, index) => line !== `${line.slice(0, 64)}  ${expected[index]}` || !/^[a-f0-9]{64}  /.test(line))) throw Error('Unexpected release files.');
          const allowed = new Set([...expected, 'SHA256SUMS', 'NOTES.md', 'candidate.json']);
          for (const file of fs.readdirSync('candidate')) {
            if (!allowed.has(file) || !fs.lstatSync(`candidate/${file}`).isFile()) throw Error('Unexpected file or symlink in release artifact.');
          }
          CHECK
          NPM_VERSION="$(npm --version)" node --input-type=module <<'NPMCHECK'
          const version = process.env.NPM_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error('Expected a stable npm version.');
          const [major, minor, patch] = version.split('.').map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw Error('npm trusted publishing requires npm 11.5.1 or newer.');
          console.log(`npm ${version}`);
          NPMCHECK
      - name: Attest the exact archives
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            candidate/*.tgz
            candidate/*-portable.tar.gz
      - id: registry
        name: Check whether these exact npm bytes were already published
        env:
          VERSION: ${{ needs.eligible.outputs.version }}
        run: |
          node --input-type=module <<'REGISTRY'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const version = process.env.VERSION;
          const response = await fetch(`https://registry.npmjs.org/@nalebc%2freach/${encodeURIComponent(version)}`, { signal: AbortSignal.timeout(30000) });
          // The package at all: a first publish can't use trusted publishing
          // (npm needs the package to exist before a publisher is set).
          const any = await fetch('https://registry.npmjs.org/@nalebc%2freach', { signal: AbortSignal.timeout(30000) });
          if (any.status !== 404 && !any.ok) throw Error(`npm registry check failed: ${any.status}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `exists=${any.ok}\n`);
          let published = false;
          if (response.status !== 404) {
            if (!response.ok) throw Error(`npm registry check failed: ${response.status}`);
            const pkg = await response.json();
            const integrity = `sha512-${crypto.createHash('sha512').update(fs.readFileSync(`candidate/nalebc-reach-${version}.tgz`)).digest('base64')}`;
            if (pkg.name !== '@nalebc/reach' || pkg.version !== version || pkg.dist?.integrity !== integrity) throw Error('Published version does not match the verified candidate bytes.');
            published = true;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          REGISTRY
      - name: Publish using npm trusted publishing, without lifecycle scripts
        if: steps.registry.outputs.published == 'false'
        # Configure the npm trusted publisher for release.yml + npm-release.
        # No long-lived npm token, npm ci, source checkout, or npm install here.
        # Only while the package doesn't exist yet (npm can't trust a publisher
        # for a package it doesn't have), a one-time, short-lived token from
        # this protected environment publishes it; once it exists, that token
        # is refused and must be deleted (.github/MAINTAINER_SETUP.md).
        env:
          VERSION: ${{ needs.eligible.outputs.version }}
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          PACKAGE_EXISTS: ${{ steps.registry.outputs.exists }}
          FIRST_PUBLISH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE_EXISTS" = "true" ]; then
            if [ -n "$FIRST_PUBLISH_TOKEN" ]; then
              echo "::error::@nalebc/reach is on npm: delete NPM_FIRST_PUBLISH_TOKEN from the npm-release environment and the token on npmjs.com. Releases publish through trusted publishing."
              exit 1
            fi
          else
            if [ -z "$FIRST_PUBLISH_TOKEN" ]; then
              echo "::error::First publish of @nalebc/reach: add a one-time NPM_FIRST_PUBLISH_TOKEN to the npm-release environment (.github/MAINTAINER_SETUP.md), then re-run this job."
              exit 1
            fi
            # npm reads the token from the environment; it's never written out.
            export NODE_AUTH_TOKEN="$FIRST_PUBLISH_TOKEN"
            # shellcheck disable=SC2016 # literal: npm expands it, the token never lands in the file
            printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/first-publish.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/first-publish.npmrc"
          fi
          npm publish "candidate/nalebc-reach-$VERSION.tgz" --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org
      - id: github-release
        name: Create or complete the exact GitHub release without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.eligible.outputs.version }}
        run: |
          node --input-type=module <<'GITHUB_RELEASE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const { VERSION: version, GITHUB_REF_NAME: tag, GITHUB_SHA: commit, GITHUB_REPOSITORY: repository, GH_TOKEN: token } = process.env;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version) || tag !== `v${version}` || !/^[a-f0-9]{40}$/.test(commit) ||
              !/^[A-Za-z0-9][A-Za-z0-9_.-]*\/[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(repository) || !token) throw Error('Invalid release identity.');
          const npm = `nalebc-reach-${version}.tgz`, portable = `reach-${version}-portable.tar.gz`;
          const receipt = JSON.parse(fs.readFileSync('candidate/candidate.json', 'utf8'));
          if (receipt.package !== '@nalebc/reach' || receipt.version !== version || receipt.commit !== commit || receipt.npm !== npm || receipt.portable !== portable)
            throw Error('Release receipt does not identify this verified candidate.');
          const files = new Map([npm, portable, 'SHA256SUMS', 'candidate.json'].map(name => {
            if (!fs.lstatSync(`candidate/${name}`).isFile()) throw Error('Release assets must be regular files.');
            const bytes = fs.readFileSync(`candidate/${name}`);
            return [name, { size: bytes.length, digest: `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}` }];
          }));
          const notes = fs.readFileSync('candidate/NOTES.md', 'utf8');
          const title = `Reach ${version}`, prerelease = version.includes('-');
          const base = `https://api.github.com/repos/${repository}`;
          async function request(url, { method = 'GET', body, binary = false } = {}) {
            const response = await fetch(url, { method, redirect: 'error', signal: AbortSignal.timeout(120000),
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'User-Agent': 'Reach-release', 'X-GitHub-Api-Version': '2026-03-10',
                ...(body === undefined ? {} : { 'Content-Type': binary ? 'application/octet-stream' : 'application/json' }) },
              ...(body === undefined ? {} : { body: binary ? body : JSON.stringify(body) }) });
            if (!response.ok) throw Error(`GitHub release request failed: ${method} ${response.status}`);
            return response.json();
          }
          async function verifyTag() {
            const ref = await request(`${base}/git/ref/tags/${encodeURIComponent(tag)}`);
            if (ref.ref !== `refs/tags/${tag}`) throw Error('The release tag is missing or ambiguous.');
            let object = ref.object;
            for (let depth = 0; object?.type === 'tag' && depth < 5; depth++) {
              if (!/^[a-f0-9]{40}$/.test(object.sha)) throw Error('Invalid annotated tag.');
              object = (await request(`${base}/git/tags/${object.sha}`)).object;
            }
            if (object?.type !== 'commit' || object.sha !== commit) throw Error('The release tag no longer points to this tested commit.');
          }
          function validateRelease(release) {
            if (!Number.isSafeInteger(release?.id) || release.id < 1 || release.tag_name !== tag || release.target_commitish !== commit ||
                release.name !== title || release.body !== notes || release.prerelease !== prerelease || typeof release.draft !== 'boolean')
              throw Error('Existing release identity, target or notes conflict with this candidate.');
          }
          function validateAssets(assets) {
            if (!Array.isArray(assets) || assets.length > files.size) throw Error('Unexpected release assets.');
            const found = new Set();
            for (const asset of assets) {
              const expected = files.get(asset.name);
              if (!expected || found.has(asset.name) || asset.state !== 'uploaded' || asset.size !== expected.size || asset.digest !== expected.digest)
                throw Error('Existing release asset does not match the verified candidate bytes.');
              found.add(asset.name);
            }
            return found;
          }
          await verifyTag();
          // The by-tag endpoint excludes drafts; list with the write token so a
          // failed upload or lost create response resumes the same draft.
          let release;
          for (let page = 1; ; page++) {
            if (page > 100) throw Error('Release history exceeds the bounded recovery scan.');
            const releases = await request(`${base}/releases?per_page=100&page=${page}`);
            if (!Array.isArray(releases)) throw Error('Invalid release listing.');
            for (const entry of releases.filter(entry => entry.tag_name === tag)) {
              if (release) throw Error('Multiple releases use this tag.');
              release = entry;
            }
            if (releases.length < 100) break;
          }
          if (!release) release = await request(`${base}/releases`, { method: 'POST', body: {
            tag_name: tag, target_commitish: commit, name: title, body: notes, draft: true, prerelease,
          } });
          validateRelease(release);
          const assetURL = `${base}/releases/${release.id}/assets?per_page=100`;
          let found = validateAssets(await request(assetURL));
          if (!release.draft && found.size !== files.size) throw Error('Published release is incomplete; refusing to modify it.');
          for (const [name, expected] of files) {
            if (found.has(name)) continue;
            // Never delete, overwrite or repoint anything. A conflicting upload
            // fails; a lost response is checked by digest on the next run.
            const bytes = fs.readFileSync(`candidate/${name}`);
            if (bytes.length !== expected.size || `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}` !== expected.digest)
              throw Error('Release candidate changed during upload.');
            const asset = await request(`https://uploads.github.com/repos/${repository}/releases/${release.id}/assets?name=${encodeURIComponent(name)}`,
              { method: 'POST', body: bytes, binary: true });
            if (asset.name !== name) throw Error('Unexpected uploaded asset.');
            validateAssets([asset]);
          }
          // Re-read both the draft and its assets before making it public.
          // An already-published exact release is a read-only successful retry.
          release = await request(`${base}/releases/${release.id}`);
          validateRelease(release);
          found = validateAssets(await request(assetURL));
          if (found.size !== files.size) throw Error('The release assets are incomplete.');
          await verifyTag();
          if (release.draft) {
            release = await request(`${base}/releases/${release.id}`, { method: 'PATCH', body: { draft: false } });
            validateRelease(release);
            if (release.draft) throw Error('GitHub did not publish the completed release.');
          }
          console.log(`Verified GitHub release ${tag} at ${commit}.`);
          GITHUB_RELEASE
