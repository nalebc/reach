name: OpenSSF Scorecard
# Advisory default-branch publication stays outside the reusable release checks.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      public: ${{ steps.repo.outputs.public }}
    steps:
      - id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)"
          case "$private" in
            false) echo "public=true" >> "$GITHUB_OUTPUT" ;;
            true) echo "public=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Could not determine repository visibility" >&2; exit 1 ;;
          esac
  scorecard:
    needs: visibility
    if: needs.visibility.outputs.public == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
