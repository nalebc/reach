{
  "name": "CI guard validation (intentional probe failures)",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "probe": {
      "name": "guard(${{ matrix.case }})",
      "runs-on": "windows-2025",
      "timeout-minutes": 5,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "case": [
            "earlier_failure",
            "build_failure",
            "package_failure",
            "installed_failure",
            "success"
          ],
          "suite": [
            "windows"
          ]
        }
      },
      "env": {
        "REACH_GUARD_MODE": "${{ matrix.case }}"
      },
      "steps": [
        {
          "name": "Build",
          "id": "release_build",
          "shell": "pwsh",
          "run": "Write-Output 'CI guard marker: Build'\nif ($env:REACH_GUARD_MODE -eq 'build_failure') { exit 7 }\nexit 0"
        },
        {
          "name": "Contracts",
          "id": "contracts",
          "if": "${{ !cancelled() && steps.release_build.outcome == 'success' && matrix.suite == 'windows' }}",
          "shell": "pwsh",
          "run": "Write-Output 'CI guard marker: Contracts'\nif ($env:REACH_GUARD_MODE -eq 'earlier_failure') { exit 7 }\nexit 0"
        },
        {
          "name": "Peer",
          "id": "peer",
          "if": "${{ !cancelled() && steps.release_build.outcome == 'success' && runner.os == 'Windows' }}",
          "shell": "pwsh",
          "run": "Write-Output 'CI guard marker: Peer'\nexit 0"
        },
        {
          "name": "Native",
          "id": "native",
          "if": "${{ !cancelled() && steps.release_build.outcome == 'success' && runner.os == 'Windows' }}",
          "shell": "pwsh",
          "run": "Write-Output 'CI guard marker: Native'\nexit 0"
        },
        {
          "name": "Package",
          "id": "package_build",
          "if": "${{ !cancelled() && steps.release_build.outcome == 'success' }}",
          "shell": "pwsh",
          "run": "Write-Output 'CI guard marker: Package'\nif ($env:REACH_GUARD_MODE -eq 'package_failure') { exit 7 }\nexit 0"
        },
        {
          "name": "Verify package",
          "id": "package_verify",
          "if": "${{ !cancelled() && steps.package_build.outcome == 'success' }}",
          "shell": "pwsh",
          "run": "Write-Output 'CI guard marker: Verify package'\nexit 0"
        },
        {
          "name": "Installed",
          "id": "installed",
          "if": "${{ !cancelled() && steps.package_build.outcome == 'success' }}",
          "shell": "pwsh",
          "run": "Write-Output 'CI guard marker: Installed'\nif ($env:REACH_GUARD_MODE -eq 'installed_failure') { exit 7 }\nexit 0"
        },
        {
          "name": "Candidate",
          "id": "candidate",
          "if": "${{ success() }}",
          "shell": "pwsh",
          "run": "Write-Output 'CI guard marker: Candidate'\nexit 0"
        }
      ]
    },
    "verify": {
      "name": "Verify expected guard behavior",
      "needs": [
        "probe"
      ],
      "if": "!cancelled()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Assert real runner phase decisions and failed-job status",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 - <<'PY'\nimport json, os, subprocess, time\nexpected = {\n 'earlier_failure': ['success','failure','success','success','success','success','success','skipped'],\n 'build_failure': ['failure'] + ['skipped'] * 7,\n 'package_failure': ['success'] * 4 + ['failure','skipped','skipped','skipped'],\n 'installed_failure': ['success'] * 6 + ['failure','skipped'],\n 'success': ['success'] * 8,\n}\nnames = ['Build','Contracts','Peer','Native','Package','Verify package','Installed','Candidate']\nfor attempt in range(5):\n raw = subprocess.check_output(['gh','api','repos/nalebc/reach/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/jobs?per_page=100'], text=True)\n data = json.loads(raw)\n jobs = {j['name']:j for j in data['jobs']}\n if all('guard('+mode+')' in jobs and jobs['guard('+mode+')']['status']=='completed' for mode in expected): break\n time.sleep(2)\nrecords = []\nfor mode, outcomes in expected.items():\n job = jobs['guard('+mode+')']\n actual = {s['name']:s['conclusion'] for s in job['steps']}\n assert [actual[n] for n in names] == outcomes, (mode, actual, outcomes)\n assert job['conclusion'] == ('success' if mode=='success' else 'failure'), (mode,job['conclusion'])\n records.append({'case':mode,'conclusion':job['conclusion'],'steps':{n:actual[n] for n in names}})\nprint(json.dumps({'probeScope':'Actual GitHub Windows condition evaluation with inert sentinel steps, not product/device qualification','sourceWorkflowSHA256':'9ae5868d3d0a8937c7d44e19ed0afc0b05134180b23e1c2cf023507aea7b8359','sourceCommit':'6938afe4d08605c330c9d27795d6459836e4f09a','allExpected':True,'cases':records},indent=2))\nPY"
        }
      ]
    }
  }
}
