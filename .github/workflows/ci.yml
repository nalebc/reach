name: Intel watcher diagnostic
# Manual scoped canary only; excluded from release-candidate ancestry.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  intel-watch:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Confirm the original Intel Node baseline
        run: node -e 'if (process.versions.node !== "22.23.2" || process.arch !== "x64" || process.platform !== "darwin") process.exit(1)'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tailnet/go.mod
          cache: false
      - run: npm ci
      - run: ./reach --help
      - run: npm run build:release
        id: release_build
      - name: Scoped watcher diagnostics and modeled controls (not full qualification)
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        run: npm run test:ci
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          REACH_TEST_WATCH_REPORT: reports/agent-watch-bursts.jsonl
      - name: Preserve bounded evidence even after a failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-intel-watch-aa5a2f5
          path: reports/
          if-no-files-found: error
          retention-days: 14
