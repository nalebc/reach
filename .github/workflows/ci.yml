name: Targeted macOS runtime validation
# Validation branch only: archive separately, never merge into the PR.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Actual Intel Mach-O inspection and kernel sandbox boundaries
        env:
          REACH_TEST_SCRIPT_SANDBOX: "1"
        run: |
          mkdir -p reports
          npm run test:file -- --test-timeout=60000 --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/intel-runtime.xml test/node-runtime-files.test.mjs test/browser-script-guarded-files.test.mjs
      - name: Preserve reports after a test failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targeted-intel-runtime
          path: reports/
          if-no-files-found: warn
          retention-days: 14
