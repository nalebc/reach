name: Security scans
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      public: ${{ steps.repo.outputs.public }}
    steps:
      - id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)"
          case "$private" in
            false) echo "public=true" >> "$GITHUB_OUTPUT" ;;
            true) echo "public=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Could not determine repository visibility" >&2; exit 1 ;;
          esac
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tailnet/go.mod
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Credentials in the entire commit history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner
  codeql:
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # This dedicated analysis job does not install or execute project code.
    # GitHub supports SARIF uploads from fork PRs without a writable PR token.
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
  dependency-review:
    needs: visibility
    if: github.event_name == 'pull_request' && needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
  required:
    name: Security required
    if: always()
    needs: [visibility, secrets, codeql, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout: evaluate only the declared prerequisite results. Public
      # scans must succeed; private-plan skips are explicit and visible.
      - name: Require all applicable security checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'CHECK'
          const results = JSON.parse(process.env.RESULTS);
          const expect = (job, state = 'success') => {
            if (results[job]?.result !== state) throw Error(`${job} must be ${state}; got ${results[job]?.result}`);
          };
          expect('visibility');
          expect('secrets');
          const visibility = results.visibility.outputs?.public;
          if (visibility !== 'true' && visibility !== 'false') throw Error('Missing or malformed repository visibility.');
          const publicRepo = visibility === 'true';
          expect('codeql', publicRepo ? 'success' : 'skipped');
          expect('dependency-review', publicRepo && process.env.EVENT_NAME === 'pull_request' ? 'success' : 'skipped');
          if (!publicRepo) console.log('Private repository: CodeQL/dependency review require public visibility or an eligible plan. Secret scan and dependency audits remain mandatory.');
          CHECK
