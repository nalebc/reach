name: Feature request
description: Suggest an improvement to Reach.
body:
  - type: markdown
    attributes:
      value: "Use sample data only. Never include invitation links, credentials, private addresses or device names."
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation (which computer, phone or agent) and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should Reach do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Workarounds, related issues, or a sketch of the screen.
